name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /smart-attendance-system/
      - name: Verify build output
        working-directory: frontend
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          JS_FOUND=$(find dist/assets -type f -name '*.js' -size +0c -print -quit || true)
          CSS_FOUND=$(find dist/assets -type f -name '*.css' -size +0c -print -quit || true)
          [ -n "$JS_FOUND" ] || { echo "Missing non-empty JS asset"; exit 1; }
          [ -n "$CSS_FOUND" ] || { echo "Missing non-empty CSS asset"; exit 1; }
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://hrishbah.github.io/smart-attendance-system/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
